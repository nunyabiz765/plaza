[package]
name = "plaza"
version = "0.1.2"
edition = "2021"
description = "An 80s polysynth for vaporwave: ensemble chorus, lush reverb, tape"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "plaza"
path = "src/lib.rs"

[[bin]]
name = "plaza"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
midir = "0.11"
rtrb = "0.3"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }

# Linux: native PipeWire, falling back to PulseAudio, then ALSA. Windows gets WASAPI and
# macOS CoreAudio from cpal's defaults.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire", "pulseaudio"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
dirs = "6"

[target.'cfg(windows)'.dependencies]
dirs = "6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
