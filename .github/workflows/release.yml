# Builds Plaza for Linux, Windows and macOS. On a v* tag it uploads all three to that
# tag's GitHub release, creating a draft release if there isn't one yet (publish it by
# hand after checking). Existing assets are never replaced: an upload with a name that
# is already there fails instead. Run it by hand (workflow_dispatch) to get the builds
# as workflow artifacts only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-latest
    # Debian 12, so the binary asks for glibc 2.35+ like the v0.1.0 tarball.
    container: debian:12
    steps:
      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config curl ca-certificates git \
            python3 clang libclang-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libpulse-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Smoke test (CLI)
        run: |
          target/release/plaza --version
          target/release/plaza render -o smoke.wav 'Chorus Pad=chords'
          test "$(stat -c%s smoke.wav)" -gt 100000
      - run: tools/package-linux.sh target/release/plaza dist
      - uses: actions/upload-artifact@v7
        with: { name: dist-linux, path: dist/*, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    env:
      # Static C runtime: Plaza.exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
      PYTHON: python
      # Azure Artifact Signing (formerly Trusted Signing) switches on when these repository
      # secrets exist; see the signing notes in the release docs. Unsigned otherwise.
      HAVE_AZ_SIGN: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Smoke test (CLI)
        run: |
          target/release/plaza.exe --version
          target/release/plaza.exe presets
          target/release/plaza.exe render -o smoke.wav 'Chorus Pad=chords'
          test "$(stat -c%s smoke.wav)" -gt 100000
      - name: Smoke test (the window opens and stays up, muted)
        shell: pwsh
        run: |
          $p = Start-Process target/release/plaza.exe -ArgumentList "--muted" -PassThru
          Start-Sleep 12
          if ($p.HasExited) { throw "Plaza exited with code $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots/windows-runner.png")
          Stop-Process $p
      - uses: actions/upload-artifact@v7
        with: { name: shot-windows, path: shots/*, if-no-files-found: warn }
      - name: Sign Plaza.exe (only with the secrets set)
        if: env.HAVE_AZ_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Plaza
          description-url: https://centerpointlabs.dev/services/plaza/
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the signature (only with the secrets set)
        if: env.HAVE_AZ_SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target/release/plaza.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "Plaza.exe signature is $($sig.Status)" }
      - run: tools/package-windows.sh target/release/plaza.exe dist
      - uses: actions/upload-artifact@v7
        with: { name: dist-windows, path: dist/*, if-no-files-found: error }

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Signing and notarizing switch on when these repository secrets exist; without
      # them the .app is ad-hoc signed. MACOS_CERT_P12 = base64 of a Developer ID
      # Application .p12; NOTARY_KEY_P8 = base64 of an App Store Connect API key (.p8).
      HAVE_MAC_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAVE_NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --release --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Smoke test (CLI, then the window opens and stays up, muted)
        run: |
          B=target/aarch64-apple-darwin/release/plaza
          $B --version
          $B render -o smoke.wav 'Chorus Pad=chords'
          test "$(stat -f%z smoke.wav)" -gt 100000
          arch -x86_64 target/x86_64-apple-darwin/release/plaza render -o smoke-x86.wav 'Chorus Pad=chords'
          $B --muted & P=$!
          sleep 12
          kill -0 $P
          mkdir -p shots && (screencapture -x shots/macos-runner.png || true)
          kill $P
      - uses: actions/upload-artifact@v7
        with: { name: shot-macos, path: shots/*, if-no-files-found: warn }
      - name: Signing certificate (only with the secrets set)
        if: env.HAVE_MAC_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$ID"
          echo "MACOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Notary key (only with the secrets set)
        if: env.HAVE_NOTARY_KEY == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          { echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"; echo "NOTARY_KEY_ID=$KEY_ID"; echo "NOTARY_ISSUER=$ISSUER"; } >> "$GITHUB_ENV"
      - run: |
          tools/package-macos.sh target/aarch64-apple-darwin/release/plaza \
            target/x86_64-apple-darwin/release/plaza dist
      - uses: actions/upload-artifact@v7
        with: { name: dist-macos, path: dist/*, if-no-files-found: error }

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: dist-*, merge-multiple: true }
      - run: ls -la dist
      - name: Draft the release if the tag has none
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "Plaza ${TAG#v}" --notes "Linux, Windows and macOS builds. Notes to follow."
      - name: Upload (fails rather than overwrite an existing asset)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$TAG" dist/*
